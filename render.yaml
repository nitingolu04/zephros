# Render Blueprint — Aerix backend
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Set secret env vars (MONGO_URI, Firebase keys, CLIENT_URL) in the dashboard after deploy.

services:
  - type: web
    name: aerix-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
